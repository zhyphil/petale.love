name: "简单 Todo SaaS 专家分工与实施计划"
description: "分析简单 Todo SaaS 需要哪些专家、哪些职责可以兼任，并制定精简的实施计划；只做分析，不写代码。"

agents_dir: "agency-agents-zh"

llm:
  provider: codex-cli
  max_tokens: 4096
  timeout: 300000
  retry: 2

concurrency: 3

steps:
  - id: define_scope
    role: "product/product-manager"
    name: "产品经理"
    emoji: "📦"
    task: |
      用户需求：分析一个简单 Todo SaaS 应该需要哪些专家，只做分析和计划，不写代码。

      先建立供各专家共同使用的分析范围：
      1. 用户未指定目标客群、预算、团队规模、技术栈或上线日期，不得将这些信息编造为已知事实。
      2. 为便于分析，明确标注以下为“分析假设”：面向个人用户的网页待办工具，
         MVP 包含账户登录、任务创建与编辑、完成与删除、截止日期、简单筛选及跨设备同步。
      3. 暂不纳入团队协作、复杂权限、AI 功能、原生移动端和付费订阅接入；
         说明哪些业务需求出现时才需要重新考虑这些功能。
      4. 明确核心用户流程、MVP 边界，以及产品负责人需要解决的关键问题。
      5. 区分“必须有人承担的职责”和“必须单独招聘的岗位”，避免按角色数量扩张团队。

      输出不超过 500 字的范围说明，包含：
      已知需求、分析假设、核心流程、纳入与排除范围、产品职责。
      全程只做分析，不写代码，不创建项目，不执行部署或采购。
    output: scope_brief
    acceptance: |
      1. 包含“已知需求”“分析假设”“核心流程”“纳入与排除范围”“产品职责”五部分。
      2. 明确将客群与功能设定标记为分析假设，并列出暂不纳入的功能。
      3. 明确区分职责覆盖与独立招聘。

  - id: assess_design
    role: "design/design-ux-researcher"
    name: "用户体验设计师"
    emoji: "🎨"
    depends_on: [define_scope]
    task: |
      用户需求：分析简单 Todo SaaS 需要哪些专家，只做分析和计划，不写代码。
      共同范围：{{scope_brief}}

      独立评估产品需要怎样的用户研究与体验设计支持：
      1. 围绕首次使用、添加任务、查看与筛选、完成任务，识别主要体验问题。
      2. 列出 MVP 所需的最少页面，以及空状态、加载、错误、误删恢复等关键状态。
      3. 判断是否需要独立 UX 研究员、UI 设计师，还是可以由一名产品设计师
         或产品负责人兼任；说明兼任所需能力和边界。
      4. 列出设计阶段应交付的材料、交接对象及可核对的完成条件。
      5. 提出小规模可用性验证方案，不声称已经访谈或测试过真实用户。

      输出不超过 450 字，使用“体验重点、专家配置、交付物与交接、
      验证方案”四部分。只给分析与计划，不生成界面代码或实际设计文件。
    output: design_assessment

  - id: assess_engineering
    role: "engineering/engineering-software-architect"
    name: "技术负责人"
    emoji: "🛠️"
    depends_on: [define_scope]
    task: |
      用户需求：分析简单 Todo SaaS 需要哪些专家，只做分析和计划，不写代码。
      共同范围：{{scope_brief}}

      独立评估工程职责和最小人员配置：
      1. 按前端、后端、数据存储、身份认证、用户数据隔离、部署运维，
         列出该简单 Todo SaaS 必须覆盖的工作。
      2. 判断一名具备相应能力的全栈工程师可以承担哪些职责，
         何时才需要独立前端、后端、数据库专家或运维工程师。
      3. 分析安全职责如何覆盖，至少包含访问控制、输入校验、密钥管理、
         备份与恢复；说明哪些情况需要安全专家专项复核。
      4. 给出简洁的系统组成和技术选择原则，不进行复杂架构扩张，
         不锁定用户未指定的技术栈，不提供代码、伪代码、命令或配置。
      5. 列出工程交付物、与产品及设计的交接要求、主要技术风险。
      6. 如给出工作量，仅使用相对大小并说明假设，不编造报价或承诺上线日期。

      输出不超过 600 字，使用“系统组成、工程职责表、兼任与增员条件、
      交付物与风险”四部分。职责表包含职责、建议承担者、是否需要独立岗位。
      只分析，不访问或修改代码库，不开通服务，不部署。
    output: engineering_assessment

  - id: assess_quality
    role: "testing/testing-reality-checker"
    name: "测试负责人"
    emoji: "✅"
    depends_on: [define_scope]
    task: |
      用户需求：分析简单 Todo SaaS 需要哪些专家，只做分析和计划，不写代码。
      共同范围：{{scope_brief}}

      基于产品范围独立制定质量与上线验证计划，无需等待设计或技术选型：
      1. 明确核心流程正确性、跨设备数据一致性、用户数据隔离、
         误操作处理及常用设备适配的检查重点。
      2. 判断开发自测、产品验收和独立测试复核分别由谁承担，
         说明什么阶段可以兼任，什么风险出现时应引入专职测试。
      3. 列出 6 条关键验收场景，每条写明操作条件和预期结果。
      4. 制定最小上线检查清单，覆盖核心流程、数据保护、故障发现和恢复验证。
      5. 所有内容必须表述为未来需要执行的检查，不得声称测试已经通过。

      输出不超过 500 字，包含“测试职责分配、六条验收场景、
      上线检查清单”。只制定计划，不编写或运行测试，不作实际发布决定。
    output: quality_assessment

  - id: deliver_plan
    role: "project-management/project-manager-senior"
    name: "项目经理"
    emoji: "👔"
    depends_on: [define_scope, assess_design, assess_engineering, assess_quality]
    task: |
      用户需求：分析一个简单 Todo SaaS 应该需要哪些专家，
      只做分析和计划，不写代码。

      整合以下材料并直接输出完整定稿：
      产品范围：{{scope_brief}}
      体验设计分析：{{design_assessment}}
      工程分析：{{engineering_assessment}}
      质量分析：{{quality_assessment}}

      先消解材料之间的范围、职责与依赖冲突，再形成面向非技术用户的精简方案。
      工作流中的多个专家是分析视角，不代表用户需要招聘同等数量的人员。

      最终成品不超过 800 字，必须包含以下五部分：
      1. 分析前提：简述简单 Todo SaaS 的假设范围，区分已知需求与假设。
      2. 专家分工表：覆盖产品、体验设计、全栈开发、测试、安全、运维六类职责。
         每行写明负责什么、是否需要独立岗位、核心交付物；
         明确安全与运维职责不能因没有专职人员而被省略。
      3. 最小团队建议：给出一套明确的精简人员组合、兼任关系与能力前提；
         说明哪些专家按需介入，以及增长、支付或团队协作出现时的增员触发条件。
      4. 四阶段计划：按需求界定、体验与技术方案、开发准备与实施规划、
         上线验证规划组织。每阶段写明负责人、交付物、完成条件，
         标出可并行工作及必须等待的前置成果。
         开发、测试执行和上线均为未来计划，本工作流不执行这些工作。
      5. 主要风险：列出三项具体风险及对应负责人和应对措施。

      不编造用户背景、团队现状、预算或日期；不把未执行的检查写成通过。
      最终交付必须是整合后的专家分工与实施计划，不是审查意见或修改建议。
      ⚠️ 只输出最终成品本身：不要开场白、不要复盘或说明、不要向用户提问、不要建议任何命令或后续动作。
    output: final_plan
    acceptance: |
      1. 包含“分析前提”“专家分工表”“最小团队建议”“四阶段计划”“主要风险”五部分。
      2. 专家分工表覆盖产品、体验设计、全栈开发、测试、安全、运维六类职责，每类均注明是否需要独立岗位及核心交付物。
      3. 最小团队建议明确人员组合、兼任关系、能力前提及按需引入专家的触发条件。
      4. 四阶段计划每阶段均包含负责人、交付物和完成条件，并标注并行关系与前置依赖。
      5. 列出三项风险及其负责人和应对措施；全文不含代码或命令，并明确开发、测试执行和上线属于未来计划。
